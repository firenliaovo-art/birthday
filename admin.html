<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>企划管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f4efe9;color:#3b3432}
.wrap{max-width:900px;margin:auto;padding:16px 12px 48px}
h1{font-size:22px;margin:8px 0 14px}
.box{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 0 rgba(0,0,0,.06)}
input,select,textarea{width:100%;padding:11px;border:1.5px solid #d9cdc3;border-radius:10px;font:inherit;margin:4px 0}
button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;background:#e7aaa0;cursor:pointer;margin:4px 4px 4px 0}
button.s{background:#e6ddd3}button.d{background:#d9777e;color:#fff}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top select{width:auto}
.nick{font-size:18px;font-weight:800}
.total{float:right;font-size:22px;font-weight:900;color:#c0626a}
.t{font-size:12px;color:#8a7c74}
.law,.wish{white-space:pre-wrap;background:#faf6f1;border-radius:10px;padding:10px;margin:6px 0;line-height:1.7;font-size:14px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.imgs figure{margin:0;font-size:12px;text-align:center}
.imgs img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f0e9e2}
audio{width:100%;margin:6px 0}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scores label{font-size:12px;color:#7d6f68}
.scores input{text-align:center}
